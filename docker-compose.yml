services:
  oiq:
    build: .
    init: true                   # clean Ctrl+C: the server is not PID 1
    ports:
      - "127.0.0.1:8765:8765"     # reachable from this machine only
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:-}      # optional: without it, recorded sessions still replay
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
    cap_drop: [ALL]
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
