# Publishes web/ (the replay player and recorded sessions) to GitHub Pages.
# Manual only: nothing is published until someone runs this workflow from the Actions tab
# (and Pages is set to "GitHub Actions" in the repository settings).
name: Publish replay player

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Build the console into web/console
        working-directory: console
        run: npm ci --no-audit --no-fund && npm run build
      - name: Check the page has no secrets or local paths
        run: |
          ! grep -rEn '/home/|C:\\\\Users|sk-[A-Za-z0-9]{16,}' web/
          ! grep -rEn '"community"|"host"|LAPTOP|prath|Pratham' web/sessions/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
