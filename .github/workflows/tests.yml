# Runs the offline tests on every push and pull request. No API key, no device, no network calls to a model.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Offline tests (recorded sessions are replayed through the real verifier)
        env:
          OIQ_PAID: "off"
        run: python -m pytest -q tests
